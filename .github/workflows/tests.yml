name: Module 4 Tests

on:
  push:
    paths:
      - "module_4/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "module_4/**"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gradcafe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gradcafe_test
      DB_PASSWORD: postgres

    defaults:
      run:
        working-directory: module_4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Module 4 tests
        run: python -m pytest -m "web or buttons or analysis or db or integration"